<script>
window.REMOTE=true;
const RC=JSON.parse(localStorage.getItem('ihps_rc')||'{}');
let mc=null,box={},lastRx=0,ackRes=null;
const rtopic=t=>'ihps/'+RC.id+'/'+t;
const mk=j=>({json:async()=>j,text:async()=>JSON.stringify(j)});
const _f=window.fetch.bind(window);
window.fetch=function(u,o){
 if(typeof u!=='string'||u.indexOf('/api/')!==0)return _f(u,o);
 const key=u.split('?')[0];
 if(o&&o.method==='POST'){
  const p=new URLSearchParams(o.body);
  if(key=='/api/floor')return new Promise(res=>{
   if(!mc||!mc.connected){res(mk({err:'غير متصل بالسيرفر'}));return}
   const to=setTimeout(()=>{ackRes=null;res(mk({err:'لم يصل رد من الجهاز (قد يكون غير متصل بالإنترنت)'}))},9000);
   ackRes=m=>{clearTimeout(to);ackRes=null;try{res(mk(JSON.parse(m)))}catch(e){res(mk({err:'رد غير مفهوم'}))}};
   mc.publish(rtopic('cmd'),'i='+p.get('i')+'&cmd='+p.get('cmd')+'&v='+(p.get('v')||0)+(p.get('confirm')=='1'?'&confirm=1':''))});
  if(key=='/api/time'||key=='/api/ping'||key=='/api/logout')return Promise.resolve(mk({ok:1}));
  return Promise.resolve(mk({err:'غير متاح عن بعد، استخدم الشبكة المحلية'}));
 }
 const map={'/api/state':'state','/api/hist':'hist','/api/usage':'usage','/api/events':'events','/api/log':'log'};
 const k=map[key];
 if(k=='state'&&(!box.state||Date.now()-lastRx>120000))return Promise.reject(new Error('no state'));
 if(!k)return Promise.reject(new Error('n/a'));
 let d;try{d=JSON.parse(box[k]||'null')}catch(e){d=null}
 if(!d)d=k=='hist'?{n:0,v:[[],[]],i:[[],[],[],[]]}:k=='usage'?{p:0,c:'',d:[],m:[]}:k=='events'?{e:[]}:k=='log'?{l:[]}:{};
 return Promise.resolve(mk(d));
};
function rform(){const M=$('#modal');M.innerHTML='<div class=mb><h3 style="margin-bottom:10px">🔌 إعداد الاتصال عن بعد</h3><p class=meta style="margin-bottom:8px">نفس بيانات سيرفر MQTT المسجّلة في القائمة الفنية للجهاز. استخدم مستخدماً مخصصاً لهذه الصفحة.</p>'
 +'<input type=text id=rh placeholder="عنوان السيرفر (xxxx.s1.eu.hivemq.cloud)" value="'+(RC.host||'')+'"><div class=gr2><input type=number id=rp placeholder="منفذ WebSocket 8884" value="'+(RC.port||8884)+'"><input type=text id=rid placeholder="معرّف الجهاز (ihps-xxxxxx)" value="'+(RC.id||'')+'"></div>'
 +'<div class=gr2><input type=text id=ru placeholder="اسم المستخدم" value="'+(RC.user||'')+'"><input type=password id=rw placeholder="كلمة السر" value="'+(RC.pass||'')+'"></div>'
 +'<div class=row><button class=btn id=rs>حفظ واتصال</button><button class="btn ghost" id=rc>إغلاق</button></div></div>';M.classList.add('show');
 $('#rc').onclick=()=>M.classList.remove('show');
 $('#rs').onclick=()=>{localStorage.setItem('ihps_rc',JSON.stringify({host:$('#rh').value.trim(),port:+$('#rp').value||8884,id:$('#rid').value.trim(),user:$('#ru').value.trim(),pass:$('#rw').value}));location.reload()}}
function rconnect(){
 if(!RC.host||!RC.id){rform();return}
 mc=mqtt.connect('wss://'+RC.host+':'+(RC.port||8884)+'/mqtt',{username:RC.user,password:RC.pass,clientId:'ihps-web-'+Math.random().toString(16).slice(2,8),reconnectPeriod:3000,connectTimeout:8000,keepalive:30});
 mc.on('connect',()=>{['state','hist','usage','events','log','ack','status'].forEach(t=>mc.subscribe(rtopic(t)));mc.publish(rtopic('watch'),'1')});
 mc.on('message',(t,m)=>{const k=t.split('/').pop();if(k=='ack'){if(ackRes)ackRes(m.toString());return}box[k]=m.toString();if(k=='state')lastRx=Date.now()});
 mc.on('error',e=>toast('خطأ اتصال: '+(e&&e.message||e),1));
 setInterval(()=>{if(mc&&mc.connected)mc.publish(rtopic('watch'),'1')},10000);
}
const $=s=>document.querySelector(s);
function toast(m,e){const t=document.createElement('div');t.className='tt'+(e?' er':'');t.textContent=window.trT?trT(m):m;$('#toast').append(t);setTimeout(()=>t.remove(),3800)}
function ask(m,ok){return new Promise(r=>{const M=$('#modal');M.innerHTML='<div class=mb><p>'+m+'</p><div class=row><button class=btn id=y>'+(ok||'متابعة')+'</button><button class="btn ghost" id=n>إلغاء</button></div></div>';M.classList.add('show');if(window.fin)fin();$('#y').onclick=()=>{M.classList.remove('show');r(true)};$('#n').onclick=()=>{M.classList.remove('show');r(false)}})}
async function api(p,d){try{const r=await fetch(p,{method:'POST',body:new URLSearchParams(d||{})});const j=await r.json();if(j.auth)location.reload();return j}catch(e){return{err:'تعذر الاتصال بالجهاز'}}}
const fmtUp=s=>{const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60);return(d?d+' يوم ':'')+h+' س '+m+' د'};
let S=null;const REM=!!window.REMOTE;
let LG=localStorage.getItem('lg')||'ar';
if(LG=='en'){document.documentElement.dir='ltr';document.documentElement.lang='en'}
const EN={'نظام الطاقة الهجين الذكي':'Smart Hybrid Power System','مباشر':'Live','الاستهلاك':'Usage','الأحداث':'Events','الأعطال':'Faults','الإعدادات':'Settings','الأوضاع':'Modes','خروج':'Logout',
'نقطة اتصال الجهاز':'Device hotspot','متصل بالشبكة المنزلية':'Connected to home network','يعمل منذ':'Uptime','إصدار':'Version','عن بعد':'Remote',
'غير متوفر':'Unavailable','متوفر':'Available','جاري التأكد':'Verifying','فولتية منخفضة':'Low voltage','فولتية مرتفعة':'High voltage','الحساس معطل':'Sensor fault',
'جاري تبديل المصدر':'Switching source','بانتظار مصدر':'Waiting for source','متوقف — محمي':'Stopped — protected','عطل في الحساس':'Sensor fault','متوقف':'Stopped','يعمل الآن':'Running now','يعمل':'Running',
'تشغيل':'On','إيقاف':'Off','اختيار المصدر':'Source','تلقائي':'Auto','وضع التشغيل':'Mode','يدوي':'Manual','دائم':'Always on','بدون انقطاع':'Uninterrupted','احتياطي':'Backup',
'مؤقت التشغيل':'Timer','المصدر الحالي':'Current source','الاستهلاك':'Usage','تصفير':'Reset','الحمل':'Load','الحد':'Limit','المدى المسموح':'Allowed range','فولت':'V',
'يتبقى':'Remaining','مؤقت تنازلي':'Countdown','إلغاء المؤقت التنازلي':'Cancel countdown','ابدأ':'Start','دقيقة':'min','ساعة':'h','مدة مخصصة بالدقائق':'Custom minutes',
'جدول يومي':'Daily schedule','الفترة':'Period','يبدأ':'Starts','ينتهي':'Ends','أحد':'Sun','اثنين':'Mon','ثلاثاء':'Tue','أربعاء':'Wed','خميس':'Thu','جمعة':'Fri','سبت':'Sat',
'نسخ هذا الجدول إلى':'Copy this schedule to','حفظ الجدول':'Save schedule','إغلاق':'Close','تم حفظ الجدول':'Schedule saved','مؤقت':'Timer',

'آخر 10 دقائق':'Last 10 minutes','الفولتية':'Voltage','التيار':'Current','سجل الأحداث':'Event log','سجل الأعطال':'Fault log','لا توجد أعطال مسجلة':'No faults recorded','مسح السجل':'Clear log',
'انقطع المصدر':'Source lost','عاد المصدر':'Source restored','تشغيل دور':'Floor on','إيقاف دور':'Floor off','تبديل المصدر':'Source switch','فصل حمل زائد':'Overload trip','فصل لحد المصدر':'Shed (source limit)','إعادة تشغيل الجهاز':'Device restart','وضع الفحص':'Test mode','اقتراب من الحد':'Near limit',
'تلقائي ':'Auto ','زر الجهاز':'Device button','الموقع':'Web','المؤقت':'Schedule','عن بُعد':'Remote','بعد':'after','من التشغيل':'since boot',
'دليل أوضاع التشغيل':'Operating modes guide','فهمت':'Got it','لا يوجد مصدر':'No source','الوقت غير مضبوط بعد، يُضبط تلقائياً من جهازك.':'Time not set yet; it syncs from your device automatically.',

const EK=Object.keys(EN).sort((a,b)=>b.length-a.length);
window.trT=s=>{if(LG!='en'||!s)return s;for(const k of EK)if(s.includes(k))s=s.split(k).join(EN[k]);return s};
function fin(){if(LG!='en')return;const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const t=trT(n.nodeValue);if(t!==n.nodeValue)n.nodeValue=t}document.querySelectorAll('[placeholder]').forEach(e=>{e.placeholder=trT(e.placeholder)})}

const SL={ok:'متوفر',chk:'جاري التأكد',low:'فولتية منخفضة',high:'فولتية مرتفعة',abs:'غير متوفر',flt:'الحساس معطل'};
const FL={on:'يعمل',off:'متوقف',sw:'جاري تبديل المصدر',wait:'بانتظار مصدر',lock:'متوقف — محمي',fault:'عطل في الحساس'};

async function sim(i,v){const r=await api('/api/sim',{src:i,v:v});if(r.err)toast(r.err,1);load()}
async function fl(i,cmd,v,c){const r=await api('/api/floor',{i:i,cmd:cmd,v:v===undefined?0:v,confirm:c?1:0});
 if(r.confirm){if(await ask(r.confirm,'تأكيد التشغيل'))return fl(i,cmd,v,1)}else if(r.err)toast(r.err,1);load()}

function draw(){
 const tb=$('#tb');if(S.tl>0){tb.style.display='block';tb.innerHTML='🧪 <b>تنبيه: وضع الفحص مفعّل</b> — تم تجاوز حماية الحساسات وغياب المصادر. ينتهي بعد '+Math.floor(S.tl/60)+':'+String(S.tl%60).padStart(2,'0');if(!window.tw){window.tw=1;toast('⚠️ وضع الفحص مفعّل',1)}}else{tb.style.display='none';window.tw=0}
 document.body.classList.toggle('ro',S.role<2);$('#bout').style.display=S.lg&&!REM?'':'none';if(REM)$('#bset').style.display='none';
 $('#net').textContent=(REM?'عن بعد • ':'')+(S.ap?'نقطة اتصال الجهاز':'متصل بالشبكة المنزلية ('+S.net+')')+' • IHPS.local • يعمل منذ '+fmtUp(S.up)+' • إصدار '+S.ver;
 $('#src').innerHTML=S.s.map((s,i)=>{const p=Math.max(0,Math.min(100,(s.v-150)/1.2));return '<div class="card '+s.st+'"><div class=ch><b>'+s.n+'</b><span class="chip '+s.st+'">'+SL[s.st]+(s.sim?' 🧪':'')+'</span></div><div class=big>'+s.v.toFixed(1)+'<small>V</small></div><div class=bar><i style="width:'+p+'%"></i></div>'
 +(s.sb>0?'<div class=warn>⏳ جاري التأكد من استقرار المصدر قبل الاعتماد عليه ('+s.sb+' ث)</div>':'')+(s.wn?'<div class=warn>⚠️ حمل المصدر مرتفع</div>':'')
 +'<div class=meta>الحمل: '+s.a.toFixed(1)+' / '+s.lm+' A • المدى المسموح '+S.vlo+' – '+S.vhi+' فولت</div>'
 +(S.tl>0?'<label>🧪 محاكاة حالة المصدر</label>'+seg([[0,'حقيقي'],[1,'✅ متوفر'],[2,'⛔ غير متوفر']],s.sim,v=>"sim("+i+","+v+")"):'')+'</div>'}).join('');
 $('#flr').innerHTML=S.f.map((f,i)=>'<div class="card '+f.st+'"><div class=ch><b>'+f.n+'</b><span class="chip '+f.st+'">'+FL[f.st]+'</span></div>'
 +(f.st=='lock'?'<div class=alert>⚠️ '+(f.lw==2?'تم فصل هذا الدور لأن حمل المصدر تجاوز حده المسموح. وزّع الأحمال ثم أعد التشغيل.':'تم إيقاف هذا الدور بسبب حمل زائد أو وجود التماس كهربائي. افحص الأحمال قبل إعادة التشغيل.')+'</div>':'')
 +(f.st=='fault'?'<div class=alert>⚠️ لم يتم التعرف على حساس الأمبير — الدور متوقف حتى إصلاح العطل.</div>':'')
 +(f.sf&&f.st=='on'?'<div class=alert>🧪 الحساس معطل — الدور يعمل بوضع الفحص بدون حماية أمبير.</div>':'')
 +(f.wn?'<div class=warn>⚠️ اقتراب من الحد الأقصى للتيار</div>':'')
 +'<div class=big>'+f.i.toFixed(1)+'<small>A</small><span>'+Math.round(f.w)+' W</span></div>'
 +'<div class=meta>المصدر الحالي: '+(f.s?S.s[f.s-1].n:'—')+' • الحد '+f.lm+'A • الاستهلاك: '+f.k.toFixed(3)+' kWh • <a class=lk onclick="fl('+i+',\'eres\')">تصفير</a></div>'
 +(f.cd>0?'<div class=alert style="background:#0ea5e922;border-color:#38bdf8aa;color:#bae6fd">⏱ مؤقت تنازلي — يتبقى '+fcd(f.cd)+'</div>':'')
 +'<div class=row><button class="pw on '+(f.on?'a':'')+'" onclick="fl('+i+',\'on\')">تشغيل</button><button class="pw off '+(!f.on?'a':'')+'" onclick="fl('+i+',\'off\')">إيقاف</button></div>'
 +'<label>اختيار المصدر</label>'+seg([[0,'تلقائي'],[1,S.s[0].n],[2,S.s[1].n]],f.p,v=>"fl("+i+",'src',"+v+")")
 +'<label>وضع التشغيل</label>'+seg([[0,'يدوي'],[1,'دائم'],[2,'بدون انقطاع'],[3,'احتياطي']],f.m,v=>"fl("+i+",'mode',"+v+")")
 +'<div class=row><button class=pw onclick="sched('+i+')">⏰ مؤقت التشغيل'+(f.sc.some(c=>c[0])?' ✅':'')+'</button></div></div>').join('');
 fin()}
async function load(){try{const r=await fetch('/api/state');const j=await r.json();if(j.auth){location.reload();return}S=j;if(!S.ep&&!window.ts&&!REM){window.ts=1;api('/api/time',{ts:Math.floor(Date.now()/1000)})}draw()}catch(e){$('#net').textContent='⚠️ انقطع الاتصال بالجهاز...'}}
const DT=()=>LG=='en'?'en':'ar';
function chart(title,sets,cols,labs,div){
 const W=300,H=110,P=16;const all=[].concat(...sets).map(x=>x/div);if(!all.length)return'';let mx=Math.max(...all,1),mn=Math.min(...all,0);if(mx==mn)mx=mn+1;
 const pl=sets.map((a,k)=>{const n=a.length;if(n<2)return'';return '<polyline fill=none stroke="'+cols[k]+'" stroke-width=1.6 stroke-linejoin=round points="'+a.map((v,j)=>(P+j*(W-P)/(n-1)).toFixed(1)+','+(H-6-(v/div-mn)/(mx-mn)*(H-14)).toFixed(1)).join(' ')+'"/>'}).join('');
 return '<div class=sub>'+title+'</div><svg class=cht viewBox="0 0 '+W+' '+H+'" preserveAspectRatio=none><text x=1 y=9 fill=#8da0c6 font-size=8>'+mx.toFixed(0)+'</text><text x=1 y='+(H-2)+' fill=#8da0c6 font-size=8>'+mn.toFixed(0)+'</text>'+pl+'</svg><div class=lg>'+labs.map((l,k)=>'<span><i style="background:'+cols[k]+'"></i>'+l+'</span>').join('')+'</div>'}
async function openChart(){
 const M=MD('<div class=mb style="max-width:640px"><h3 style="margin-bottom:8px">📈 مباشر — آخر 10 دقائق</h3><div id=chv>...</div><div class=row><button class="btn ghost" id=cx>إغلاق</button></div></div>');$('#cx').onclick=()=>M.classList.remove('show');
 const upd=async()=>{if(!M.classList.contains('show')||!$('#chv'))return false;const h=await(await fetch('/api/hist')).json();
  $('#chv').innerHTML=chart('الفولتية (V)',h.v,['#38bdf8','#a78bfa'],S.s.map(x=>x.n),10)+chart('التيار (A)',h.i,['#22c55e','#f59e0b','#38bdf8','#f472b6'],S.f.map(x=>x.n),10);fin();return true};
 await upd();const t=setInterval(async()=>{if(!await upd())clearInterval(t)},5000)}
async function openUsage(tab){tab=tab||'d';const u=await(await fetch('/api/usage')).json();const rows=tab=='d'?u.d:u.m,cu=u.c||'';
 const lab=r=>tab=='d'?new Date(r[0]*864e5).toLocaleDateString(DT(),{day:'numeric',month:'short',timeZone:'UTC'}):new Date(Date.UTC(Math.floor(r[0]/12),r[0]%12,1)).toLocaleDateString(DT(),{month:'long',year:'numeric',timeZone:'UTC'});
 let tot=0;const body=rows.map(r=>{const k=r.slice(1).map(x=>x/1000),t=k.reduce((a,b)=>a+b,0);tot+=t;return '<tr><td>'+lab(r)+'</td>'+k.map(x=>'<td>'+x.toFixed(2)+'</td>').join('')+'<td><b>'+t.toFixed(2)+'</b></td>'+(u.p>0?'<td>'+(t*u.p).toFixed(2)+'</td>':'')+'</tr>'}).join('');
 const th='<tr><th>'+(tab=='d'?'اليوم':'الشهر')+'</th>'+S.f.map(f=>'<th>'+f.n+'</th>').join('')+'<th>المجموع</th>'+(u.p>0?'<th>التكلفة '+cu+'</th>':'')+'</tr>';
 const M=MD('<div class=mb style="max-width:680px"><h3 style="margin-bottom:8px">📊 الاستهلاك (kWh)</h3><div class=tabs><button class="btn '+(tab=='d'?'':'ghost')+'" id=t1>الاستهلاك اليومي</button><button class="btn '+(tab=='m'?'':'ghost')+'" id=t2>الاستهلاك الشهري</button></div>'
 +(rows.length?'<div style="overflow-x:auto"><table class=t>'+th+body+'</table></div><p class=meta style="margin-top:8px">المجموع: <b>'+tot.toFixed(2)+' kWh</b>'+(u.p>0?' • التكلفة: <b>'+(tot*u.p).toFixed(2)+' '+cu+'</b>':'')+'</p>':'<p>لا توجد بيانات بعد</p>')
 +'<div class=row>'+(REM?'':'<a class="btn ghost" href=/api/export.csv style="text-align:center">⬇️ تصدير CSV</a>')+'<button class="btn ghost" id=cx>إغلاق</button></div></div>');
 $('#cx').onclick=()=>M.classList.remove('show');$('#t1').onclick=()=>openUsage('d');$('#t2').onclick=()=>openUsage('m')}
async function openEvents(){const r=await(await fetch('/api/events')).json();const sn=S.s.map(x=>x.n),fn=S.f.map(x=>x.n);
 const T={1:['🔌','انقطع المصدر'],2:['✅','عاد المصدر'],3:['🟢','تشغيل دور'],4:['⚪','إيقاف دور'],5:['🔀','تبديل المصدر'],6:['🛑','فصل حمل زائد'],7:['🛑','فصل لحد المصدر'],8:['🔄','إعادة تشغيل الجهاز'],9:['🧪','وضع الفحص'],10:['⚠️','اقتراب من الحد'],11:['⚠️','حمل المصدر مرتفع']};
 const BY=['تلقائي','زر الجهاز','الموقع','المؤقت','المؤقت','عن بُعد'];
 const D=e=>{const v=e.v/10;switch(e.ty){case 1:case 2:case 11:return sn[e.ix]+(e.ty==2?' — '+v.toFixed(0)+'V':e.ty==11?' — '+v.toFixed(1)+'A':'');case 3:case 4:return fn[e.ix]+' — '+BY[e.by];case 5:return fn[e.ix]+' ← '+sn[Math.round(v)-1];case 6:case 7:case 10:return fn[e.ix]+' — '+v.toFixed(1)+'A';case 9:return v>0?'ON':'OFF';default:return ''}};
 const M=MD('<div class=mb><h3 style="margin-bottom:10px">🧾 سجل الأحداث</h3>'+(r.e.length?r.e.map(e=>'<div class=ev><b style="color:#e8eefc">'+(T[e.ty]?T[e.ty][0]+' '+T[e.ty][1]:e.ty)+'</b> <span class=meta>'+D(e)+'</span><br><small>'+(e.ep?new Date(e.ep*1000).toLocaleString(DT()):'بعد '+fmtUp(e.up)+' من التشغيل')+'</small></div>').join(''):'<p>لا توجد بيانات بعد</p>')+'<div class=row><button class="btn ghost" id=cx>إغلاق</button></div></div>');
 $('#cx').onclick=()=>M.classList.remove('show')}
async function openLog(){const r=await(await fetch('/api/log')).json();const sn=S.s.map(x=>x.n),fn=S.f.map(x=>x.n);
 const T={1:'انخفاض الفولتية',2:'ارتفاع الفولتية',3:'حمل زائد / ماس كهربائي',4:'عدم التعرف على حساس الأمبير',5:'عدم التعرف على حساس الفولت'};
 const D=e=>{const v=(e.v/10).toFixed(1);return e.ty==1?sn[e.ix]+': القراءة '+v+'V أقل من الحد الأدنى '+S.vlo+'V':e.ty==2?sn[e.ix]+': القراءة '+v+'V أعلى من الحد الأعلى '+S.vhi+'V':e.ty==3?fn[e.ix]+': التيار '+v+'A تجاوز '+S.f[e.ix].lm+'A — تم إيقاف الدور':e.ty==4?fn[e.ix]+': تم إيقاف الدور حتى إصلاح الحساس':sn[e.ix]+': تم إيقاف المصدر حتى إصلاح الحساس'};
 const M=MD('<div class=mb><h3 style="margin-bottom:10px">📋 سجل الأعطال ('+r.l.length+'/10)</h3>'+(r.l.length?r.l.map(e=>'<div class=ev><b>'+T[e.ty]+'</b><br>'+D(e)+'<br><small>'+(e.ep?new Date(e.ep*1000).toLocaleString(DT()):'بعد '+fmtUp(e.up)+' من التشغيل')+'</small></div>').join(''):'<p>لا توجد أعطال مسجلة ✅</p>')+(REM?'':'<div class=row><button class="btn red" id=cl>مسح السجل</button><button class="btn ghost" id=cx>إغلاق</button></div>')+(REM?'<div class=row><button class="btn ghost" id=cx>إغلاق</button></div>':'')+'</div>');
 $('#cx').onclick=()=>M.classList.remove('show');
 if($('#cl'))$('#cl').onclick=async()=>{if(await ask('هل تريد مسح جميع الأعطال؟','مسح')){await api('/api/log/clear');toast('تم مسح السجل')}else openLog();M.classList.remove('show')}}
async function cdgo(i,m){if(!(m>=1&&m<=1440)){toast('أدخل مدة من 1 إلى 1440 دقيقة',1);return}$('#modal').classList.remove('show');await fl(i,'cd',m)}
function cdcustom(i){cdgo(i,+$('#cm').value)}
async function cdstop(i){$('#modal').classList.remove('show');await fl(i,'cdx')}
function sched(i){const f=S.f[i],D=['أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة','سبت'];
 const per=p=>{const c=f.sc[p];return '<div class=pr><div class=tg><b>الفترة '+(p+1)+'</b><input type=checkbox class=se data-p='+p+' '+(c[0]?'checked':'')+'></div><div class=gr2><div><label>يبدأ</label><input type=time class=ss data-p='+p+' value="'+hm(c[1])+'"></div><div><label>ينتهي</label><input type=time class=sx data-p='+p+' value="'+hm(c[2])+'"></div></div><div class=days>'+D.map((d,k)=>'<label class=dy><input type=checkbox class=sd data-p='+p+' value='+k+' '+((c[3]>>k)&1?'checked':'')+'>'+d+'</label>').join('')+'</div></div>'};
 const M=MD('<div class=mb><h3 style="margin-bottom:6px">⏰ مؤقت — '+f.n+'</h3>'
 +'<div class=sub>⏱ مؤقت تنازلي</div>'+(f.cd>0?'<div class=alert style="background:#0ea5e922;border-color:#38bdf8aa;color:#bae6fd">يعمل الآن — يتبقى '+fcd(f.cd)+'</div>':'')
 +'<div class=seg style="margin-bottom:8px">'+[15,30,60,120].map(m=>'<button onclick="cdgo('+i+','+m+')">'+(m<60?m+' دقيقة':m/60+' ساعة')+'</button>').join('')+'</div>'
 +'<div class=row><input type=number id=cm min=1 max=1440 placeholder="مدة مخصصة بالدقائق" style="margin:0"><button class=btn style="flex:0 0 auto" onclick="cdcustom('+i+')">ابدأ</button></div>'
 +(f.cd>0?'<div class=row><button class="btn red" onclick="cdstop('+i+')">إلغاء المؤقت التنازلي</button></div>':'')
 +'<div class=sub>📅 جدول يومي (3 فترات)</div>'+(S.ep?'':'<p class=meta>⚠️ الوقت غير مضبوط بعد، يُضبط تلقائياً من جهازك.</p>')
 +per(0)+per(1)+per(2)
 +'<label>نسخ هذا الجدول إلى</label><div class=days>'+S.f.map((g,k)=>k==i?'':'<label class=dy><input type=checkbox class=cp value='+k+'>'+g.n+'</label>').join('')+'</div>'
 +'<p class=meta style="margin-bottom:10px">يشغّل الدور عند البداية ويوقفه عند النهاية، ويدعم الفترات عبر منتصف الليل. تحكمك اليدوي له الأولوية.</p>'
 +'<div class=row><button class=btn id=sv>حفظ الجدول</button><button class="btn ghost" id=sq>إغلاق</button></div></div>');
 $('#sq').onclick=()=>M.classList.remove('show');
 $('#sv').onclick=async()=>{const q=(c,p)=>document.querySelector('.'+c+'[data-p="'+p+'"]');const t=el=>{const a=el.value.split(':');return(+a[0])*60+(+a[1])};
  for(let p=0;p<3;p++){let d=0;document.querySelectorAll('.sd[data-p="'+p+'"]').forEach(e=>{if(e.checked)d|=1<<e.value});
   const r=await api('/api/sched',{i:i,p:p,en:q('se',p).checked?1:0,s:t(q('ss',p)),e:t(q('sx',p)),d:d});if(r.err){toast('الفترة '+(p+1)+': '+r.err,1);return}}
  let mask=0;document.querySelectorAll('.cp').forEach(e=>{if(e.checked)mask|=1<<e.value});if(mask)await api('/api/schedcopy',{i:i,mask:mask});
  toast('تم حفظ الجدول');M.classList.remove('show');load()}}
function help(){const M=MD('<div class=mb><h3 style="margin-bottom:10px">❓ دليل أوضاع التشغيل</h3><div class=hp>'
 +'<p><b>يدوي:</b> الدور يشتغل ويتوقف بأمرك فقط (زر الجهاز أو الموقع).</p>'
 +'<p><b>دائم:</b> يشتغل تلقائياً على المصدر الذي تختاره (١ أو ٢) كلما توفر، ويرجع بعد انقطاع الكهرباء، ولا يتوقف إلا بأمرك أو عند حماية الحمل.</p>'

 +'<table><tr><th>الوضع</th><th>١ موجود</th><th>١ غائب و٢ موجود</th><th>لا كهرباء</th></tr><tr><td>دائم على ١</td><td>على ١</td><td>متوقف</td><td>متوقف</td></tr><tr><td>دائم على ٢</td><td>على ٢</td><td>على ٢</td><td>متوقف</td></tr><tr><td>بدون انقطاع</td><td>على ١</td><td>على ٢</td><td>متوقف</td></tr><tr><td>احتياطي</td><td>متوقف</td><td>على ٢</td><td>متوقف</td></tr></table>'

 +'<p><b>المؤقت ⏰:</b> تنازلي (يشغّل الآن ويوقف بعد المدة) أو جدول يومي بثلاث فترات يمكن نسخها لأدوار أخرى.</p>'
 +'<p><b>التأكد من الاستقرار:</b> قبل الرجوع للمصدر ١ ينتظر الجهاز حتى تثبت فولتيته، وتحسب المدة تلقائياً من كثرة الانقطاعات وتذبذب الفولتية. والتشغيل بعد رجوع الكهرباء يكون متدرجاً (دور بعد دور).</p>'
 +'<p><b>الحدود:</b> كل دور له حد أمبير (حتى 28A) وكل مصدر له حد (حتى 112A). عند تجاوز حد المصدر يُفصل آخر دور تشغيلاً، وعند الاقتراب من الحد يظهر تحذير.</p>'
 +'<p class=meta>الأزرار الفيزيائية لها الأولوية دائماً، والدور الذي فصلته الحماية لا يعود إلا بأمرك.</p></div><div class=row><button class=btn id=hx>فهمت</button></div></div>');
 $('#hx').onclick=()=>M.classList.remove('show')}
